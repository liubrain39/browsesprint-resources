name: Public first-read network comparison
on:
  push:
    branches: [codex/first-read-network-20261020]
    paths:
      - benchmarks/redirect-drain-20261020/**
      - .github/workflows/first-read-network.yml
permissions:
  contents: read
concurrency:
  group: browsesprint-first-read-network-20261020
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCH_BROWSER: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: benchmarks/redirect-drain-20261020
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install pinned test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the runner-installed sandboxed browser
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Decrypt the one-run private test package
        run: node decrypt.mjs
        env:
          BROWSESPRINT_BENCH_KEY: ${{ secrets.BROWSESPRINT_REDIRECT_DRAIN_20261020 }}
      - name: Complete client and settled browser comparison
        run: node launch.mjs
      - name: Remove decrypted code and temporary results
        if: always()
        run: node -e "require('fs').rmSync('.runner-private',{recursive:true,force:true})"
