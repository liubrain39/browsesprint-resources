name: Public first-read network comparison
on:
  push:
    branches: [codex/first-read-network-20261020]
    paths:
      - benchmarks/first-read-20261020/**
      - .github/workflows/first-read-network.yml
permissions:
  contents: read
concurrency:
  group: browsesprint-first-read-network-20261020
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCH_BROWSER: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: benchmarks/first-read-20261020
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install pinned public benchmark dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check destination boundaries
        run: npm test
      - name: Check the runner-installed sandboxed Chrome
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          BENCH_SMOKE=1 BENCH_OUT=smoke-evidence npm run bench
      - name: Read public pages and retain all outcomes in the log
        run: npm run bench
        env:
          CI: "true"
